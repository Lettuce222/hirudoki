# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

plugins:
  - rubocop-rspec

require:
  - ./lib/rubocop/cop/hirudoki/restful_actions

Hirudoki/RestfulActions:
  Description: Restrict public controller methods to the seven standard REST actions.
  Enabled: true
  Include:
    - app/controllers/**/*_controller.rb

Rails/UniqueValidationWithoutIndex:
  Enabled: true

RSpec:
  Enabled: false

RSpec/LeakyConstantDeclaration:
  Enabled: true

RSpec/LeakyLocalVariable:
  Enabled: true
