# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

plugins:
  - rubocop-rspec
  - rubocop-factory_bot

require:
  - ./lib/rubocop/cop/hirudoki/controller_base
  - ./lib/rubocop/cop/hirudoki/order_scope_name
  - ./lib/rubocop/cop/hirudoki/deterministic_spec_date
  - ./lib/rubocop/cop/hirudoki/model_factory
  - ./lib/rubocop/cop/hirudoki/request_spec_controller
  - ./lib/rubocop/cop/hirudoki/restful_actions
  - ./lib/rubocop/cop/hirudoki/strong_parameters_method

FactoryBot:
  Enabled: true

FactoryBot/AttributeDefinedStatically:
  Enabled: true

FactoryBot/SyntaxMethods:
  Enabled: true

FactoryBot/ConsistentParenthesesStyle:
  Enabled: true
  EnforcedStyle: require_parentheses

FactoryBot/FactoryNameStyle:
  Enabled: true
  EnforcedStyle: symbol

Hirudoki/ControllerBase:
  Description: Use one inheritance level per controller namespace.
  Enabled: true
  Include:
    - app/controllers/**/*_controller.rb

Hirudoki/OrderScopeName:
  Description: Name simple ordering scopes asc_by_<column> or desc_by_<column> according to the primary sort key.
  Enabled: true
  Include:
    - app/models/**/*.rb

Hirudoki/DeterministicSpecDate:
  Description: Keep test dates repeatable and express elapsed time in domain units.
  Enabled: true
  Include:
    - spec/**/*.rb

Hirudoki/ModelFactory:
  Description: Use factories for test records of the listed models.
  Enabled: true
  Models:
    - Administrator
    - Bento
    - DailyMenu
    - DeliveryArea
    - Order
    - User
  Include:
    - spec/**/*_spec.rb

Hirudoki/RequestSpecController:
  Description: Match request spec paths to controllers and require named route helpers.
  Enabled: true
  Include:
    - spec/requests/**/*.rb

Hirudoki/StrongParametersMethod:
  Description: Declare permitted controller attributes in private *_params methods.
  Enabled: true
  Include:
    - app/controllers/**/*_controller.rb

Hirudoki/RestfulActions:
  Description: Restrict public controller methods to the seven standard REST actions.
  Enabled: true
  Include:
    - app/controllers/**/*_controller.rb

Style/HashSyntax:
  EnforcedShorthandSyntax: always

Rails/UniqueValidationWithoutIndex:
  Enabled: true

RSpec:
  Enabled: false

RSpec/LeakyConstantDeclaration:
  Enabled: true

RSpec/LeakyLocalVariable:
  Enabled: true

Style/EmptyMethod:
  Enabled: true
  EnforcedStyle: compact
