services:
  - type: web
    name: hirudoki
    runtime: ruby
    repo: https://github.com/Lettuce222/hirudoki
    branch: main
    region: singapore
    plan: 0.5c-512mb
    buildCommand: bin/render-build.sh
    preDeployCommand: bin/render-pre-deploy.sh
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    autoDeployTrigger: checksPass
    disk:
      name: hirudoki-images
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hirudoki-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: ACTIVE_STORAGE_ROOT
        value: /opt/render/project/src/storage

databases:
  - name: hirudoki-db
    databaseName: hirudoki_production
    region: singapore
    plan: 0.1c-256mb
    postgresMajorVersion: "18"
    diskSizeGB: 1
    ipAllowList: []
